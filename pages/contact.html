<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Contact Us - Jimenez Boxing Camp</title>

<link rel="stylesheet" href="css/contact.css">


</head>

<body>


<section class="contact" id="contact">

    <h1>Contact Us</h1>
    <p>Get in touch with Jimenez Boxing Camp.</p>

    <form class="contact-form">

        <input 
            type="text" 
            name="name" 
            placeholder="Your Name" 
            required
        >

        <input 
            type="email" 
            name="email" 
            placeholder="Your Email" 
            required
        >

        <input 
            type="text" 
            name="subject" 
            placeholder="Subject"
        >

        <textarea 
            name="message" 
            rows="6" 
            placeholder="Write your message here..."
            required
        ></textarea>

        <button type="submit">Submit</button>

    </form>

</section>


</body>

</html>
